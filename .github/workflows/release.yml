name: release

# A tag v<version> builds, signs and uploads a release to the Central Portal for validation (kickoff 12, decision 92). It does
# not publish: the owner looks at the deployment in the Central Portal and publishes it there by hand.
#
# A release takes its version from the tag it was pushed as, nowhere else (kickoff 20, decision 155): main always carries a
# snapshot version, and this job sets the release version with versions:set in its own checkout only, never committing or
# pushing it. Every artifact, the archive's name and top folder, its VERSION file and what "slay400 --version" prints all
# carry the tag's version because of that one step, not because anything in the repository names a release version.
#
# Safety:
#  * It starts only from a pushed tag, never for a pull request, and never with pull_request_target.
#  * It runs in the GitHub environment "release", which the owner protects with a required reviewer.
#  * The job can read the repository and nothing else.
#  * The secrets are CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE of that environment,
#    and no step prints them. The private key is passed to the signer in an environment variable and stays in memory: no key
#    ring, no file. When a secret is missing, the job stops with one line that says which.
#  * scripts/check_release_tag.py runs first, before any secret is used: the tag must be v<MAJOR.MINOR.PATCH>, optionally with
#    a pre-release part, not itself a snapshot; the tagged commit must be an ancestor of origin/main (a tag on a commit that is
#    not in main is never released); its line (MAJOR.MINOR.PATCH) must be the line of the snapshot in the POMs; every module
#    must share that snapshot version; no other tag of this name may already point elsewhere; and the version must not already
#    be on Maven Central (skipped, not refused, if Central's public search cannot be reached).
#  * The workflow never pushes to a branch and never moves or creates a tag.
#  * No build cache: a job that holds the secrets takes nothing from a cache that other jobs write.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    # contents: write, in this job only (the workflow default above stays read): finds or creates the GitHub Release of the
    # tag and attaches the distribution archives to it (kickoff 17; found-or-made, kickoff 20). Nothing else changes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the tagged commit's ancestry can be checked against origin/main below.
          fetch-depth: 0

      - name: Check that the tag can be released
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Check that the secrets exist
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$CENTRAL_TOKEN_USERNAME" ] || missing="$missing CENTRAL_TOKEN_USERNAME"
          [ -n "$CENTRAL_TOKEN_PASSWORD" ] || missing="$missing CENTRAL_TOKEN_PASSWORD"
          [ -n "$GPG_PRIVATE_KEY" ] || missing="$missing GPG_PRIVATE_KEY"
          [ -n "$GPG_PASSPHRASE" ] || missing="$missing GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) missing in the environment 'release':$missing. Nothing was built or uploaded."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          # Writes a settings.xml with the server "central" that reads the two environment variables below; no value is stored.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      # The one place the release version is set (kickoff 20, decision 155): every module, pcml-bom included, in this
      # checkout only. Nothing is committed or pushed; main keeps its snapshot version throughout.
      - name: Set the version from the tag
        run: ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false

      # The whole build with its tests, as for any commit. It also makes the test jars that some modules share, which the
      # release profile leaves out of what is published.
      - name: Build and test
        run: ./mvnw -B install

      # "clean" matters: "install" has already made the shaded jar of pcml-cli in target/, and without "clean" the shade plugin
      # packs that jar a second time (duplicate entry: META-INF/NOTICE-slay400-core). These two commands must stay the same as
      # in the release-files job of build.yml, which runs them without signing and without uploading.
      - name: Sign and upload for validation
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # The names that maven-gpg-plugin reads (signer bc): the armored private key, and its passphrase.
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease -DskipTests -Dinvoker.skip=true clean deploy

      # The archives pcml-launcher just built for Central carry its artifactId (pcml-launcher-<version>.tar.gz), the
      # name every other published file follows; the GitHub Release asset a person downloads uses the product name
      # instead (slay400-<version>.tar.gz), matching the archive's own top folder and install.sh / install.ps1,
      # which download exactly that name. No secret is used: GH_TOKEN is the default token of this job.
      #
      # Found or made, never duplicated (kickoff 20, point 4): a release for this tag may already exist, made by hand
      # on GitHub's release page before this workflow ran; scripts/github_release.py attaches these four files to it,
      # replacing any of the same name, instead of creating a second release. A version with a pre-release part is
      # marked a pre-release only when this call is the one that creates it; an existing release's draft, pre-release
      # and "latest" flags are never changed.
      - name: Attach the distribution archives to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          for ext in tar.gz zip; do
            cp "pcml-launcher/target/pcml-launcher-$version.$ext" "release-assets/slay400-$version.$ext"
          done
          (cd release-assets && for ext in tar.gz zip; do
            sha256sum "slay400-$version.$ext" > "slay400-$version.$ext.sha256"
          done)
          prerelease_flag=""
          case "$version" in *-*) prerelease_flag="--prerelease" ;; esac
          python3 scripts/github_release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" $prerelease_flag release-assets/*
