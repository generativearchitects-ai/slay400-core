name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      # The launch scripts and the install scripts (kickoff 17): shellcheck ships with this runner image. PSScriptAnalyzer,
      # pinned, is the same static check for install.ps1; it does not ship with the runner.
      - name: shellcheck the shell scripts
        run: shellcheck install.sh pcml-launcher/src/main/scripts/slay400
      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  # The launcher tests (kickoff 17), on the three operating systems the launch scripts and install scripts target:
  # LauncherScriptTest (the scripts, run directly) and the install.sh / install.ps1 tests (against a local stand-in
  # for GitHub Releases, never the real network). Builds only pcml-cli and pcml-launcher, with their dependencies.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build pcml-cli and pcml-launcher, and run their tests
        run: ./mvnw -B -pl pcml-cli,pcml-launcher -am verify
      - name: Install script tests (install.sh on Linux and macOS, install.ps1 on all three)
        run: python3 -m unittest scripts.test_install -v
      # For the acceptance criteria of kickoff 17 (run the CI-built archive, not a local one): one copy of each
      # archive, from the Linux leg, as a build artifact.
      - name: Upload the distribution archives
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slay400-distribution
          path: pcml-launcher/target/pcml-launcher-*.tar.gz

  # Mutation testing: PIT changes the production code in small ways and the tests must notice.
  # Fails if fewer than ${mutation.threshold} percent (see pom.xml) of the mutants are killed.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mutation tests
        run: ./mvnw -B -Pmutation verify
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: '*/target/pit-reports'
          if-no-files-found: ignore

  # What a release would publish, checked without publishing anything (kickoff 12): the release profile stages every module
  # without signing and without uploading, and the files, the POM elements and the licence files are checked. A small project
  # that depends on the staged files the way the gateway will is built against them. No secret is used.
  release-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests of the release checks
        run: python3 -m unittest discover -s scripts
      # The next two commands MUST STAY THE SAME as the ones that snapshot.yml and release.yml run to publish: an ordinary
      # "install", then the release-profile "clean deploy". If they differ, this job stops seeing what the publishing jobs hit
      # (C243: "deploy" without "clean" after "install" made the shade plugin pack the shaded jar of pcml-cli a second time, and
      # only the first snapshot run found out). The only differences allowed: here -Dgpg.skip=true and -DskipUpload=true (nothing
      # is signed or uploaded; snapshot.yml also skips signing), and release.yml runs the tests in its "install". Change one place,
      # change all three.
      # The ordinary build also makes the test jars that some modules share, which the release profile leaves out.
      - name: Install the modules
        run: ./mvnw -B install -DskipTests -Dinvoker.skip=true
      - name: Stage the release (no signature, no upload)
        run: ./mvnw -B -Prelease -Dgpg.skip=true -DskipUpload=true -DskipTests -Dinvoker.skip=true clean deploy
      - name: Check the staged files
        run: python3 scripts/check_staged_artifacts.py target/central-deferred
      - name: Build a consumer against the staged files
        run: >
          ./mvnw -B -f consumer-check/pom.xml
          -Dslay400.version="$(python3 -I -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")"
          -Dstaging.repo="file://$PWD/target/central-deferred"
          -Dmaven.repo.local="$PWD/target/consumer-repo"
          test

  # Two builds of the same commit give the same bytes.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build twice and compare checksums
        run: scripts/check-reproducible.sh
